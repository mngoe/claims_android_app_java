name: CI

on:
  push:
    branches:
      - '*'
#    tags:
#      - '!v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Environment info
        run: |
          gradle --version

      - name: build
        run: |
          ./gradlew assemblecomoresDevDebug --stacktrace

      - name: Environment info
        run: |
          gradle --version

      - uses: actions/upload-artifact@v4
        with:
          name: claim-comores-${{github.run_number}}.apk
          path: ./claimManagement/build/outputs/**/*.apk

      - name: build
        run: |
          ./gradlew bundlecomoresDevDebug --stacktrace

      - name: Environment info
        run: |
          gradle --version

      - uses: actions/upload-artifact@v4
        with:
          name: claim-comores-${{github.run_number}}.aab
          path: ./claimManagement/build/outputs/**/*.aab
