name: Develop Comores

on:
  push:
    branches: [ "feature-31757" ]
  pull_request:
    branches: [ "feature-31757" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > policies_comores.jks

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-disabled: true

      - name: Build release APK
        run: ./gradlew assemblecomoresDevDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK exists
        run: ls -la claimManagement/build/outputs/apk/comoresDev/debug/

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp claimManagement/build/outputs/apk/comoresDev/debug/claimManagement-comoresDev-debug.apk artifacts/claims-comores-test.apk

      - name: Generate release timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ steps.timestamp.outputs.timestamp }}
          release_name: Comores Build ${{ steps.timestamp.outputs.timestamp }}
          draft: false
          prerelease: true
          body: |
            Automated build from branch ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Build date: $(date +'%Y-%m-%d %H:%M:%S')

      - name: Upload APK as Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/claims-comores-test.apk
          asset_name: claims-comores-test.apk
          asset_content_type: application/vnd.android.package-archive


      - name: Upload APK as Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: claims-comores-test
          path: artifacts/claims-comores-test.apk