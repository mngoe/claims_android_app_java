name: Build APK

on:
  push:
    branches: [ "test-csu" ]
  pull_request:
    branches: [ "test-csu" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build APK
        run: ./gradlew assembleCsuDevDebug --stacktrace

