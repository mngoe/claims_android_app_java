name: claims-Feature Comores Release

on:
  push:
    branches: [ "feature-38564" ]

jobs:
  build:
    name: Build and Publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          overwrite-settings: false

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > policies_comores.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          validate-wrappers: false

      - name: Build release APK (unsigned)
        run: ./gradlew assemblecomoresDevRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify release APK exists
        run: ls -la claimManagement/build/outputs/apk/comoresDev/release/

      - name: Sign APK
        run: |
          "${{ steps.paths.outputs.apksigner }}" sign \
            --ks policies_comores.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out claims-comores-dev-release.apk \
            "${{ steps.paths.outputs.apk_unsigned }}"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify signed APK
        run: |
          "${{ steps.paths.outputs.apksigner }}" verify claims-comores-dev-release.apk

      - name: Extract versionName
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('claimManagement/build/outputs/apk/comoresDev/release/output-metadata.json', 'r', encoding='utf-8'))['elements'][0]['versionName'])")
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to release tag comores-dev
        uses: softprops/action-gh-release@v2
        with:
          tag_name: comores-dev
          name: ${{ steps.version.outputs.version_name }}
          files: claims-comores-dev-release.apk
          overwrite_files: true