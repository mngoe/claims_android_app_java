name: Develop Comores

on:
  push:
    branches: [ "feature-31757" ]
  pull_request:
    branches: [ "feature-31757" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        run: echo "Repository checked out."

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
        run: echo "JDK 17 setup complete."

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > policies_comores.jks
          echo "Keystore decoded."

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-disabled: true
        run: echo "Gradle setup complete."

      - name: Verify Gradle Tasks
        run: |
          ./gradlew tasks
          echo "Gradle tasks verified."

      - name: Build release APK
        run: ./gradlew assemblecomoresDevDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          run: echo "Release APK built."

      - name: Explore build directory
        run: |
          ls -R .
          echo "Build directory explored."

      - name: Rename APK
        run: |
          mv claimManagement/build/outputs/apk/bephaDev/debug/*.apk claims-comores-test.apk || echo "APK not found"
          echo "APK renamed."

      - name: List APK files
        run: |
          ls -l claims-comores-test.apk || echo "APK not found"
          echo "APK files listed."

      - name: Upload APK
        if: success() && steps.rename_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: claims-comores-test.apk
          path: claims-comores-test.apk
        run: echo "APK uploaded."