name: claims-Feature Comores Release

on:
  push:
    branches: [ "feature-38564" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag and asset name
        id: release_meta
        run: |
          RELEASE_TAG=$(grep -oE 'resValue "string",[[:space:]]*"release_tag",[[:space:]]*"[^"]+"' claimManagement/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)"$/\1/')
          if [ -z "$RELEASE_TAG" ]; then
            echo "release_tag not found in claimManagement/build.gradle"
            exit 1
          fi
          UPDATE_APK_NAME="claims-${RELEASE_TAG}-release.apk"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "update_apk_name=$UPDATE_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved release_tag=$RELEASE_TAG"
          echo "Resolved update_apk_name=$UPDATE_APK_NAME"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          overwrite-settings: false

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > policies_comores.jks

      - name: Create keystore.properties
        run: |
          cat > claimManagement/keystore.properties <<EOF
          storeFile=../policies_comores.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleComoresDevRelease --stacktrace --warning-mode all

      - name: Prepare updater APK asset
        run: |
          mkdir -p claimManagement/build/outputs/apk/update
          APK_PATH=$(find claimManagement/build/outputs/apk -type f -name "*.apk" ! -name "*-unsigned.apk" ! -path "*/update/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No signed APK found after build"
            exit 1
          fi
          cp "$APK_PATH" "claimManagement/build/outputs/apk/update/${{ steps.release_meta.outputs.update_apk_name }}"
          ls -la claimManagement/build/outputs/apk/update

      - name: Extract versionName
        id: app_version
        run: |
          METADATA_PATH=$(find claimManagement/build/outputs/apk -type f -name "output-metadata.json" | grep -Ei "comoresDev/.*/release|comoresDev/release" | head -n 1)
          if [ -z "$METADATA_PATH" ]; then
            METADATA_PATH=$(find claimManagement/build/outputs/apk -type f -name "output-metadata.json" | head -n 1)
          fi
          if [ -z "$METADATA_PATH" ]; then
            echo "output-metadata.json not found"
            exit 1
          fi
          VERSION_NAME=$(grep -oE '"versionName"[[:space:]]*:[[:space:]]*"[^"]+"' "$METADATA_PATH" | head -n 1 | sed -E 's/.*"([^"]+)"$/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "versionName not found in $METADATA_PATH"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: claims-comores-apk-${{ github.run_number }}.apk
          path: claimManagement/build/outputs/**/*.apk

      - name: Publish APK to release tag
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.app_version.outputs.release_title }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: claimManagement/build/outputs/apk/update/${{ steps.release_meta.outputs.update_apk_name }}