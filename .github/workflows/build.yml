name: main csu

on:
  push:
    branches: [ "main-csu" ]
  pull_request:
    branches: [ "main-csu" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-disabled: true

      - name: Build release APK
        run: ./gradlew assemblecsuDevDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK exists
        run: ls -la claimManagement/build/outputs/apk/csuDev/debug/

      - name: Rename APK
        run: |
          cp claimManagement/build/outputs/apk/csuDev/debug/claimManagement-csuDev-debug.apk claims-csu-test.apk

      - name: Upload APK (raw, no ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: claims-csu-test.apk
          path: claims-csu-test.apk
          compression-level: 0
