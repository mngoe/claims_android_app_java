name: develop-comores

on:
  push:
    branches: [ "feature-32757" ]
  pull_request:
    branches: [ "feature-32757" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Log - Repository Structure
        run: |
          echo "Liste des fichiers et dossiers après le checkout :"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Log - Java Version
        run: java -version

      - name: Decode keystore
        run: |
          echo "Décodage du keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > policies_comores.jks
          echo "Keystore créé :"
          ls -l policies_comores.jks

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-disabled: true

      - name: Log - Gradle Version
        run: ./gradlew -v

      - name: Build release APK
        run: |
          echo "Lancement du build..."
          ./gradlew assembleComoresDevDebug --stacktrace --info
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Log - APK Directory Structure
        run: |
          echo "Liste des fichiers générés dans le répertoire APK :"
          ls -R app/build/outputs/apk/

      - name: Rename APK
        run: |
          echo "Renommage du fichier APK..."
          mv app/build/outputs/apk/comoresDev/debug/app-comoresDev-debug.apk policies-comores-test.apk
          echo "APK renommé :"
          ls -l policies-comores-test.apk

      - name: Log - APK Content
        run: |
          echo "Informations sur l'APK généré :"
          file policies-comores-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: policies-comores-test.apk
          path: policies-comores-test.apk
