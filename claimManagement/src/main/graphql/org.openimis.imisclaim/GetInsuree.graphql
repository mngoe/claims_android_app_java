query GetInsuree($chfId: String) {
    insurees(
        chfId: $chfId, ignoreLocation: true
    ) {
        edges {
            node {
                id
                chfId
                lastName 
                otherNames
                dob
                family{
                    uuid
                }
                currentVillage {
                  id
                }
            }
        }
    }
}
